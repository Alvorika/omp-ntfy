[package]
name = "omp-ntfy"
version = "0.1.0"
description = "Web Push notifications when an Oh My Pi (OMP) agent finishes a task"
repository = "https://github.com/Alvorika/omp-ntfy"
homepage = "https://github.com/Alvorika/omp-ntfy"
readme = "README.md"
license = "MIT"
keywords = ["web-push", "notifications", "omp", "agent", "self-hosted"]
categories = ["command-line-utilities", "web-programming"]
edition = "2024"

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
axum = "0.8"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
hkdf = "0.13"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh", "getrandom", "alloc", "std"] }
rand_core = { version = "0.9", features = ["std", "os_rng"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = "symbols"